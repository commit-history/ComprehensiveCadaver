<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Paper.js Polygon Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 10px; }
        .controls {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #f0f0f0; }
        button.active { background: #007bff; color: white; border-color: #007bff; }
        #canvas {
            border: 2px solid #333;
            background: white;
            cursor: crosshair;
            display: block;
            margin: 20px 0;
            max-width: 100%;
            height: auto;
        }
        #status {
            padding: 10px;
            background: #e8f4f8;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Paper.js Polygon Editor</h1>
        <div class="controls">
            <button id="drawBtn">Draw Polygon</button>
            <button id="drawLineBtn">Draw Line</button>
            <button id="editBtn" class="active">Edit Mode</button>
            <button id="clearBtn">Clear All</button>
            <button id="imagePickerBtn">Load Background Image</button>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </div>
        <div id="colorControls" style="display: none; position: fixed; top: 20px; right: 20px; background: white; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000;">
            <label>Color: <input type="color" id="colorPicker"></label>
            <label id="opacityLabel" style="margin-left: 10px;">Opacity: <input type="range" id="opacitySlider" min="0" max="1" step="0.1" style="width: 100px;"></label>
            <div id="lineEndControls" style="display: none; margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px;">
                <div>
                    <label>Start: <select id="lineStartSelect" style="width: 80px;">
                        <option value="none">None</option>
                        <option value="arrow">Arrow</option>
                        <option value="circle">Circle</option>
                        <option value="diamond">Diamond</option>
                        <option value="square">Square</option>
                    </select></label>
                </div>
                <div style="margin-top: 8px;">
                    <label>End: <select id="lineEndSelect" style="width: 80px;">
                        <option value="none">None</option>
                        <option value="arrow">Arrow</option>
                        <option value="circle">Circle</option>
                        <option value="diamond">Diamond</option>
                        <option value="square">Square</option>
                    </select></label>
                </div>
            </div>
        </div>
        <div id="status">Edit mode: Click polygon to select, drag to move.</div>
        <canvas id="canvas" width="800" height="600"></canvas>
    </div>

    <script src="node_modules/paper/dist/paper-full.min.js"></script>
    <script>
        // Set up Paper.js
        paper.setup('canvas');

        // Load background image
        let backgroundRaster = null;
        const img = new Image();
        img.src = 'assets/example_img_wide.png';
        img.onload = function() {
            const canvas = document.getElementById('canvas');
            canvas.width = canvas.parentElement.offsetWidth - 4;
            canvas.height = canvas.width / (img.width / img.height);
            paper.view.viewSize = new paper.Size(canvas.width, canvas.height);

            backgroundRaster = new paper.Raster(img);
            backgroundRaster.fitBounds(paper.view.bounds);
            backgroundRaster.evented = false;
            backgroundRaster.selectable = false;
            backgroundRaster.sendToBack();
            paper.view.update();
        };

        let isDrawing = false;
        let isEditing = true; // Start in edit mode by default
        let currentPolygon = null;
        let points = [];
        let polygons = [];
        let selectedPath = null;
        let selectedPoint = null;
        let isDraggingPoint = false;
        let draggingEdgeIndex = -1;
        let createdPointThisDrag = false;
        let lastClickPoint = null;
        let handleCircles = []; // Large handle circles for visualization
        let selectedPointIndices = []; // Indices of selected points
        let polygonJustSelected = false; // Track if polygon was just selected this click
        let lastColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0'); // Remember last color
        let lastOpacity = 0.5; // Remember last opacity

        // Function to render line endpoints
        function renderLineEnds(line) {
            if (!line.polygonData || !line.polygonData.isLine) return;

            // Remove old line end markers if they exist
            if (line.lineEndGroup) {
                line.lineEndGroup.remove();
            }

            // Create group for line ends
            line.lineEndGroup = new paper.Group();
            line.lineEndGroup.evented = false;
            line.lineEndGroup.selectable = false;

            const segments = line.segments;
            const lineColor = line.strokeColor;
            const lineWidth = line.strokeWidth;

            // Render start cap
            if (line.polygonData.lineStart && line.polygonData.lineStart !== 'none') {
                const startPoint = segments[0].point;
                const nextPoint = segments[1].point;
                const angle = Math.atan2(nextPoint.y - startPoint.y, nextPoint.x - startPoint.x);
                drawLineEnd(line.lineEndGroup, startPoint, angle, line.polygonData.lineStart, lineColor, lineWidth);
            }

            // Render end cap
            if (line.polygonData.lineEnd && line.polygonData.lineEnd !== 'none') {
                const endPoint = segments[segments.length - 1].point;
                const prevPoint = segments[segments.length - 2].point;
                const angle = Math.atan2(endPoint.y - prevPoint.y, endPoint.x - prevPoint.x);
                drawLineEnd(line.lineEndGroup, endPoint, angle, line.polygonData.lineEnd, lineColor, lineWidth);
            }
        }

        function drawLineEnd(group, point, angle, style, color, lineWidth) {
            const size = lineWidth * 12;
            let shape;

            switch (style) {
                case 'arrow':
                    // Create arrow with tip at the line endpoint
                    const arrowLength = size;
                    const arrowWidth = arrowLength / 2;
                    const angleRad = angle;

                    // Arrow points: tip at line end, base perpendicular
                    const tipPoint = point;
                    const baseOffsetX = -arrowLength * Math.cos(angleRad);
                    const baseOffsetY = -arrowLength * Math.sin(angleRad);
                    const perpX = -Math.sin(angleRad);
                    const perpY = Math.cos(angleRad);

                    const leftPoint = new paper.Point(
                        point.x + baseOffsetX + perpX * arrowWidth / 2,
                        point.y + baseOffsetY + perpY * arrowWidth / 2
                    );
                    const rightPoint = new paper.Point(
                        point.x + baseOffsetX - perpX * arrowWidth / 2,
                        point.y + baseOffsetY - perpY * arrowWidth / 2
                    );

                    shape = new paper.Path([tipPoint, leftPoint, rightPoint]);
                    shape.closed = true;
                    shape.fillColor = color;
                    break;

                case 'circle':
                    shape = new paper.Path.Circle(point, size / 4);
                    shape.fillColor = color;
                    break;

                case 'square':
                    shape = new paper.Path.Rectangle({
                        center: point,
                        size: [size / 2, size / 2]
                    });
                    // No rotation for square - always straight
                    shape.fillColor = color;
                    break;

                case 'diamond':
                    shape = new paper.Path.RegularPolygon(point, 4, size / 3);
                    // No line-angle rotation for diamond - always at 45 degrees
                    shape.rotation = 45;
                    shape.fillColor = color;
                    break;
            }

            if (shape) {
                shape.strokeColor = null;
                shape.evented = false;
                shape.selectable = false;
                group.addChild(shape);
            }
        }

        const drawBtn = document.getElementById('drawBtn');
        const drawLineBtn = document.getElementById('drawLineBtn');
        const editBtn = document.getElementById('editBtn');
        const clearBtn = document.getElementById('clearBtn');
        const status = document.getElementById('status');
        const colorControls = document.getElementById('colorControls');
        const colorPicker = document.getElementById('colorPicker');
        const opacitySlider = document.getElementById('opacitySlider');
        const lineEndControls = document.getElementById('lineEndControls');
        const lineStartSelect = document.getElementById('lineStartSelect');
        const lineEndSelect = document.getElementById('lineEndSelect');

        let isDrawingLine = false;
        let lastMousePosition = null;
        const snapAngles = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330];

        function snapToNearestAngle(angle) {
            // Normalize angle to 0-360
            angle = ((angle % 360) + 360) % 360;

            // Find nearest snap angle
            let minDiff = 180;
            let nearestAngle = 0;

            for (let snap of snapAngles) {
                let diff = Math.abs(angle - snap);
                if (diff > 180) diff = 360 - diff; // Handle wrap-around

                if (diff < minDiff) {
                    minDiff = diff;
                    nearestAngle = snap;
                }
            }

            return nearestAngle;
        }

        // Initialize color controls with remembered values
        colorPicker.value = lastColor;
        opacitySlider.value = lastOpacity;

        // Draw mode
        drawBtn.addEventListener('click', function() {
            isDrawing = !isDrawing;
            isDrawingLine = false;
            isEditing = false;
            drawBtn.classList.toggle('active');
            drawLineBtn.classList.remove('active');
            editBtn.classList.remove('active');
            points = [];

            // Clean up preview elements when exiting draw mode
            if (!isDrawing) {
                const children = paper.project.activeLayer.children;
                for (let i = children.length - 1; i >= 0; i--) {
                    if (children[i].isPreviewOutline || children[i].isPreviewLine || children[i].isPreviewFace || children[i].isDrawHandle) {
                        children[i].remove();
                    }
                }

                // Deselect any selected polygon
                if (selectedPath) {
                    selectedPath.strokeColor = null;
                    hideHandles();
                    selectedPath = null;
                    selectedPoint = null;
                    selectedPointIndices = [];
                    colorPicker.blur();
                    colorControls.style.display = 'none';
                }
                paper.view.update();
            }

            status.textContent = isDrawing ? 'Drawing mode: Click to add points, right-click or ESC to finish' : 'Click "Draw Polygon" to draw';
        });

        // Draw line mode (reuses polygon logic, just stops after 2 points)
        drawLineBtn.addEventListener('click', function() {
            isDrawingLine = !isDrawingLine;
            isDrawing = isDrawingLine;
            isEditing = false;
            drawLineBtn.classList.toggle('active');
            drawBtn.classList.toggle('active', isDrawingLine);
            editBtn.classList.remove('active');
            points = [];

            // Clean up preview elements when exiting line draw mode
            if (!isDrawingLine) {
                const children = paper.project.activeLayer.children;
                for (let i = children.length - 1; i >= 0; i--) {
                    if (children[i].isPreviewOutline || children[i].isPreviewLine || children[i].isPreviewFace || children[i].isDrawHandle) {
                        children[i].remove();
                    }
                }

                // Deselect any selected polygon
                if (selectedPath) {
                    selectedPath.strokeColor = null;
                    hideHandles();
                    selectedPath = null;
                    selectedPoint = null;
                    selectedPointIndices = [];
                    colorPicker.blur();
                    colorControls.style.display = 'none';
                }
                paper.view.update();
            }

            status.textContent = isDrawingLine ? 'Drawing line: Click 2 points, right-click or ESC to finish' : 'Click "Draw Line" to draw';
        });

        // Edit mode
        editBtn.addEventListener('click', function() {
            isEditing = !isEditing;
            isDrawing = false;
            editBtn.classList.toggle('active');
            drawBtn.classList.remove('active');
            status.textContent = isEditing ? 'Edit mode: Click polygon to select, drag points to move' : 'Click "Edit Mode" to edit';
        });

        // Clear all
        clearBtn.addEventListener('click', function() {
            paper.project.activeLayer.removeChildren();
            polygons = [];
            points = [];
            isDrawing = false;
            isEditing = false;
            drawBtn.classList.remove('active');
            editBtn.classList.remove('active');
            selectedPath = null;
            colorControls.style.display = 'none';
            status.textContent = 'Canvas cleared';
        });

        // Color picker
        colorPicker.addEventListener('input', function() {
            const hex = colorPicker.value;
            const r = parseInt(hex.substr(1, 2), 16) / 255;
            const g = parseInt(hex.substr(3, 2), 16) / 255;
            const b = parseInt(hex.substr(5, 2), 16) / 255;

            if (selectedPath) {
                if (selectedPath.polygonData.isLine) {
                    // Update stroke color for lines
                    selectedPath.strokeColor = new paper.Color(r, g, b);
                    renderLineEnds(selectedPath);
                } else {
                    // Update fill color for polygons
                    lastColor = hex;
                    const opacity = parseFloat(opacitySlider.value);
                    selectedPath.fillColor = new paper.Color(r, g, b, opacity);
                }
                paper.view.update();
            }
        });

        // Opacity slider
        opacitySlider.addEventListener('input', function() {
            lastOpacity = parseFloat(opacitySlider.value); // Remember the opacity
            if (selectedPath && !selectedPath.polygonData.isLine) {
                const hex = colorPicker.value;
                const r = parseInt(hex.substr(1, 2), 16) / 255;
                const g = parseInt(hex.substr(3, 2), 16) / 255;
                const b = parseInt(hex.substr(5, 2), 16) / 255;
                const opacity = parseFloat(opacitySlider.value);
                selectedPath.fillColor = new paper.Color(r, g, b, opacity);
                paper.view.update();
            }
        });

        // Line start select
        lineStartSelect.addEventListener('change', function() {
            if (selectedPath && selectedPath.polygonData.isLine) {
                selectedPath.polygonData.lineStart = lineStartSelect.value;
                renderLineEnds(selectedPath);
                paper.view.update();
            }
        });

        // Line end select
        lineEndSelect.addEventListener('change', function() {
            if (selectedPath && selectedPath.polygonData.isLine) {
                selectedPath.polygonData.lineEnd = lineEndSelect.value;
                renderLineEnds(selectedPath);
                paper.view.update();
            }
        });

        // Image picker
        const imagePickerBtn = document.getElementById('imagePickerBtn');
        const imageInput = document.getElementById('imageInput');

        imagePickerBtn.addEventListener('click', function() {
            imageInput.click();
        });

        imageInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                handleImageFile(e.target.files[0]);
            }
        });

        async function handleImageFile(file) {
            const fileName = file.name;

            // Try to find the image in media, assets, or images folders
            const possiblePaths = [
                `media/${fileName}`,
                `assets/${fileName}`,
                `images/${fileName}`
            ];

            // Check which paths exist by trying to load them
            for (const path of possiblePaths) {
                try {
                    const response = await fetch(path, { method: 'HEAD' });
                    if (response.ok) {
                        loadBackgroundImage(path);
                        status.textContent = 'Background image loaded: ' + path;
                        return;
                    }
                } catch (e) {
                    // Continue to next path
                }
            }

            // Image not found in standard locations
            const addToAssets = confirm(
                `Image "${fileName}" not found in media, assets, or images folders.\n\n` +
                'Would you like to:\n' +
                '- OK: Add to assets folder\n' +
                '- Cancel: Enter custom path'
            );

            if (addToAssets) {
                // Try loading from assets (user can manually add the file there)
                const assetPath = `assets/${fileName}`;
                loadBackgroundImage(assetPath);
                status.textContent = 'Please add ' + fileName + ' to assets folder. Attempting to load from: ' + assetPath;
            } else {
                // Let user enter custom path
                const customPath = prompt('Enter relative path to image:', fileName);
                if (customPath && customPath.trim()) {
                    loadBackgroundImage(customPath.trim());
                    status.textContent = 'Background image loaded: ' + customPath;
                }
            }
        }

        function loadBackgroundImage(imagePath) {
            // Remove old background raster if it exists
            if (backgroundRaster) {
                backgroundRaster.remove();
            }

            const img = new Image();
            img.onload = function() {
                // Calculate available width from container
                const container = document.querySelector('.container');
                const containerWidth = container ? container.offsetWidth : window.innerWidth - 40;

                // Scale to fit container width
                canvas.width = Math.min(containerWidth, img.width);
                canvas.height = canvas.width / (img.width / img.height);
                paper.view.viewSize = new paper.Size(canvas.width, canvas.height);

                // Create and fit raster
                backgroundRaster = new paper.Raster(img);
                backgroundRaster.fitBounds(paper.view.bounds);
                backgroundRaster.evented = false;
                backgroundRaster.selectable = false;
                backgroundRaster.sendToBack();
                paper.view.update();
            };
            img.src = imagePath;
        }

        // Canvas click handler
        paper.view.onMouseDown = function(event) {
            if (isDrawing) {
                // Don't add point on double-click (it will be handled by onDoubleClick)
                if (event.detail && event.detail >= 2) {
                    return;
                }

                let pointToAdd = event.point.clone();

                // Apply angle snapping if shift is held and we have a previous point
                if (event.modifiers.shift && points.length > 0) {
                    const prevPoint = points[points.length - 1];
                    const dx = pointToAdd.x - prevPoint.x;
                    const dy = pointToAdd.y - prevPoint.y;
                    let angle = Math.atan2(dy, dx) * 180 / Math.PI;

                    if (angle < 0) angle += 360;

                    const snapAngle = snapToNearestAngle(angle);
                    const snapAngleRad = snapAngle * Math.PI / 180;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    pointToAdd = new paper.Point(
                        prevPoint.x + distance * Math.cos(snapAngleRad),
                        prevPoint.y + distance * Math.sin(snapAngleRad)
                    );
                }

                points.push(pointToAdd);
                lastClickPoint = event.point.clone();

                // Log the point position and distance from previous point
                console.log(`Point ${points.length}: (${Math.round(pointToAdd.x)}, ${Math.round(pointToAdd.y)})`);
                if (points.length > 1) {
                    const prevPoint = points[points.length - 2];
                    const distance = pointToAdd.getDistance(prevPoint);
                    console.log(`  Distance from previous: ${Math.round(distance)}px`);
                }

                // Draw a handle at the click point (like edit mode)
                const isLatest = points.length > 0; // This is the latest point
                const handleRect = new paper.Path.Rectangle({
                    center: pointToAdd,
                    size: isLatest ? [8, 8] : [5, 5],
                    fillColor: isLatest ? '#0064c8' : 'white',
                    strokeColor: '#0064c8',
                    strokeWidth: 1
                });

                // Draw line from previous point
                if (points.length > 1) {
                    const line = new paper.Path.Line(points[points.length - 2], points[points.length - 1]);
                    line.strokeColor = 'black';
                    line.strokeWidth = 1;
                }

                // Update all previous points to non-selected state
                if (points.length > 1) {
                    const children = paper.project.activeLayer.children;
                    let handleCount = 0;
                    for (let i = children.length - 1; i >= 0; i--) {
                        const child = children[i];
                        if (child.isDrawHandle) {
                            handleCount++;
                            if (handleCount > 1) { // Skip the latest handle
                                child.size = new paper.Size(5, 5);
                                child.fillColor = 'white';
                            }
                        }
                    }
                }

                handleRect.isDrawHandle = true;

                // Draw preview outline if we have 2+ points (for lines) or 3+ points (for polygons)
                const minPreviewPoints = isDrawingLine ? 2 : 3;
                if (points.length >= minPreviewPoints) {
                    // Remove old preview outline
                    const children = paper.project.activeLayer.children;
                    for (let i = children.length - 1; i >= 0; i--) {
                        if (children[i].isPreviewOutline) {
                            children[i].remove();
                        }
                    }

                    // Draw new preview outline (open path, never closed during draw)
                    const outline = new paper.Path(points);
                    outline.closed = false;
                    outline.strokeColor = 'black';
                    outline.strokeWidth = 1;
                    outline.fillColor = null;
                    outline.isPreviewOutline = true;
                    outline.sendToBack();
                }

                status.textContent = `Drawing: ${points.length} points (right-click or ESC to finish)`;
            } else if (isEditing) {
                // Hit test to select polygon or point
                const hitResult = paper.project.hitTest(event.point, {
                    fill: true,
                    segments: true,
                    stroke: true,
                    tolerance: 15
                });

                // Check for segment click first (works with or without polygon selected)
                // Also check for shift+click near segments
                let segmentHit = hitResult && hitResult.type === 'segment' && hitResult.item.polygonData;

                // If shift+click on polygon, try to find nearest segment
                if (!segmentHit && event.shiftKey && hitResult && hitResult.item.polygonData) {
                    const poly = hitResult.item;
                    let minDist = 15; // tolerance
                    let nearestSegment = null;

                    poly.segments.forEach((seg, idx) => {
                        const dist = event.point.getDistance(seg.point);
                        if (dist < minDist) {
                            minDist = dist;
                            nearestSegment = { segment: seg, index: idx, item: poly };
                        }
                    });

                    if (nearestSegment) {
                        hitResult = nearestSegment;
                        segmentHit = true;
                    }
                }

                if (segmentHit) {
                    if (selectedPath !== hitResult.item) {
                        selectedPath = hitResult.item;
                        selectedPath.strokeColor = 'black';
                        selectedPath.strokeWidth = 1;
                    }

                    const segmentIndex = hitResult.index !== undefined ? hitResult.index : hitResult.segment.index;

                    if (event.shiftKey) {
                        // Shift+click: toggle selection
                        const idx = selectedPointIndices.indexOf(segmentIndex);
                        if (idx >= 0) {
                            selectedPointIndices.splice(idx, 1);
                        } else {
                            selectedPointIndices.push(segmentIndex);
                        }
                    } else {
                        // Regular click: select only this point
                        selectedPointIndices = [segmentIndex];
                    }

                    selectedPoint = hitResult.segment;
                    isDraggingPoint = true;
                    showHandles(selectedPath);
                    status.textContent = `Selected ${selectedPointIndices.length} point(s) - drag to move`;
                    draggingEdgeIndex = -1;
                } else if (hitResult && hitResult.item.polygonData) {
                    // Polygon or line hit but not segment
                    // If switching to a different polygon, hide the old one's outline
                    if (selectedPath && selectedPath !== hitResult.item) {
                        if (!selectedPath.polygonData.isLine) {
                            selectedPath.strokeColor = null;
                        }
                        hideHandles();
                        selectedPointIndices = [];
                        polygonJustSelected = true; // Reset for new polygon
                    }

                    selectedPath = hitResult.item;
                    if (!selectedPath.polygonData.isLine) {
                        selectedPath.strokeColor = 'black';
                        selectedPath.strokeWidth = 1;
                    }
                    draggingEdgeIndex = -1;

                    // Update color controls
                    if (selectedPath.polygonData.isLine) {
                        // Line: show stroke color and line ending controls
                        const rgb = selectedPath.strokeColor;
                        const hex = '#' + [rgb.red, rgb.green, rgb.blue].map(x => {
                            const hex = Math.round(x * 255).toString(16);
                            return hex.length === 1 ? '0' + hex : hex;
                        }).join('');
                        colorPicker.value = hex;
                        document.getElementById('opacityLabel').style.display = 'none';
                        lineEndControls.style.display = 'block';

                        // Set line ending styles
                        lineStartSelect.value = selectedPath.polygonData.lineStart || 'none';
                        lineEndSelect.value = selectedPath.polygonData.lineEnd || 'none';
                    } else {
                        // Polygon: show fill color and opacity
                        if (selectedPath.fillColor) {
                            const rgb = selectedPath.fillColor;
                            const hex = '#' + [rgb.red, rgb.green, rgb.blue].map(x => {
                                const hex = Math.round(x * 255).toString(16);
                                return hex.length === 1 ? '0' + hex : hex;
                            }).join('');
                            colorPicker.value = hex;
                            opacitySlider.value = rgb.alpha || 0.5;
                        }
                        document.getElementById('opacityLabel').style.display = 'block';
                        lineEndControls.style.display = 'none';
                    }
                    colorControls.style.display = 'block';

                    if (hitResult.type === 'stroke') {
                        // Clicked on edge - mark it for adding a point
                        draggingEdgeIndex = Math.floor(hitResult.location.index);
                        isDraggingPoint = false;
                        status.textContent = 'Drag to add point on edge';
                        console.log('Edge selected at index:', draggingEdgeIndex);
                    } else {
                        // Polygon selected, no specific point clicked
                        isDraggingPoint = false;
                        const isNewPolygon = !polygonJustSelected && selectedPointIndices.length === 0;

                        if (isNewPolygon) {
                            // First click on this polygon - just show handlers
                            selectedPointIndices = [];
                            showHandles(selectedPath);
                            status.textContent = 'Polygon selected - click again to select all points';
                            polygonJustSelected = true;
                        } else if (selectedPointIndices.length === 0) {
                            // Second click - select all
                            selectedPointIndices = selectedPath.segments.map((_, idx) => idx);
                            showHandles(selectedPath);
                            status.textContent = `Selected all ${selectedPointIndices.length} points - click again to deselect`;
                        } else {
                            // Third click - deselect all
                            selectedPointIndices = [];
                            showHandles(selectedPath);
                            status.textContent = 'All points deselected - click to select all';
                            polygonJustSelected = true;
                        }
                    }
                } else if (selectedPath) {
                    // Only hide stroke for polygons, not lines
                    if (!selectedPath.polygonData.isLine) {
                        selectedPath.strokeColor = null;
                    }
                    hideHandles();
                    selectedPath = null;
                    selectedPoint = null;
                    selectedPointIndices = [];
                    polygonJustSelected = false;
                    isDraggingPoint = false;
                    draggingEdgeIndex = -1;
                    colorPicker.blur();
                    colorControls.style.display = 'none';
                }
            }
        };

        // Canvas double-click handler (for edit mode only)
        paper.view.onDoubleClick = function(event) {
            if (isEditing && selectedPath) {
                // Double-click on edge to create a point
                const hitResult = paper.project.hitTest(event.point, {
                    stroke: true,
                    tolerance: 15
                });

                if (hitResult && hitResult.type === 'stroke') {
                    const edgeIndex = Math.floor(hitResult.location.index);
                    const newSegment = new paper.Segment(event.point);
                    selectedPath.insert(edgeIndex + 1, newSegment);

                    // Create handle for new point
                    const handleRect = new paper.Path.Rectangle({
                        center: event.point,
                        size: [5, 5],
                        fillColor: 'white',
                        strokeColor: '#0064c8',
                        strokeWidth: 1,
                        evented: false,
                        selectable: false
                    });
                    handleRect.isHandle = true;
                    handleCircles.splice(edgeIndex + 1, 0, handleRect);

                    selectedPointIndices = [edgeIndex + 1]; // Select the new point
                    showHandles(selectedPath);

                    status.textContent = 'Point created on edge';
                    console.log('Point created at edge index:', edgeIndex);
                }
            }
        };

        // Right-click handler - finish drawing (like ESC)
        document.getElementById('canvas').addEventListener('contextmenu', function(event) {
            const minPoints = isDrawingLine ? 2 : 3;
            if (isDrawing && points.length >= minPoints) {
                event.preventDefault();
                finishPolygon();
            }
        });

        // Mouse move handler - change cursor on hover
        paper.view.onMouseMove = function(event) {
            if (isEditing && selectedPath) {
                const hitResult = paper.project.hitTest(event.point, {
                    segments: true,
                    tolerance: 8
                });

                if (hitResult && hitResult.type === 'segment') {
                    document.getElementById('canvas').style.cursor = 'pointer';
                } else {
                    document.getElementById('canvas').style.cursor = 'default';
                }
            }
        };

        // Mouse up handler - clear selection
        paper.view.onMouseUp = function(event) {
            if (isEditing) {
                isDraggingPoint = false;
                draggingEdgeIndex = -1;
                createdPointThisDrag = false;
                if (selectedPath) {
                    status.textContent = 'Polygon selected - click to deselect';
                } else {
                    status.textContent = 'Edit mode: Click polygon to select';
                }
            }
        };

        // Mouse move handler for draw mode cursor preview
        paper.view.onMouseMove = function(event) {
            if (isDrawing && points.length > 0) {
                // Remove old preview elements
                const children = paper.project.activeLayer.children;
                for (let i = children.length - 1; i >= 0; i--) {
                    if (children[i].isPreviewLine || children[i].isPreviewFace) {
                        children[i].remove();
                    }
                }

                // Draw preview line from last point to cursor
                const lastPoint = points[points.length - 1];
                let cursorPoint = event.point.clone();

                // Apply angle snapping to the preview if shift is held
                if (event.modifiers.shift) {
                    const dx = cursorPoint.x - lastPoint.x;
                    const dy = cursorPoint.y - lastPoint.y;
                    let angle = Math.atan2(dy, dx) * 180 / Math.PI;

                    if (angle < 0) angle += 360;

                    const snapAngle = snapToNearestAngle(angle);
                    const snapAngleRad = snapAngle * Math.PI / 180;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    cursorPoint = new paper.Point(
                        lastPoint.x + distance * Math.cos(snapAngleRad),
                        lastPoint.y + distance * Math.sin(snapAngleRad)
                    );
                }

                // Draw preview face for polygons (filled area with all points + cursor)
                if (!isDrawingLine && points.length >= 2) {
                    const previewPoints = [...points, cursorPoint];
                    const face = new paper.Path(previewPoints);
                    face.closed = true;
                    // Use the current polygon color with opacity
                    const r = parseInt(lastColor.substr(1, 2), 16) / 255;
                    const g = parseInt(lastColor.substr(3, 2), 16) / 255;
                    const b = parseInt(lastColor.substr(5, 2), 16) / 255;
                    face.fillColor = new paper.Color(r, g, b, lastOpacity);
                    face.strokeColor = null;
                    face.isPreviewFace = true;
                    face.evented = false;
                    face.selectable = false;
                    face.sendToBack();
                }

                const previewLine = new paper.Path.Line(lastPoint, cursorPoint);
                previewLine.strokeColor = '#ff6600';
                previewLine.strokeWidth = 2;
                previewLine.dashArray = [5, 5];
                previewLine.isPreviewLine = true;
                previewLine.evented = false;
                previewLine.selectable = false;
                backgroundRaster.sendToBack();
            }
        };

        // Mouse drag handler
        paper.view.onMouseDrag = function(event) {
            if (isEditing && selectedPath) {
                if (isDraggingPoint && selectedPoint) {
                    // Move all selected points
                    const draggedIdx = selectedPoint.index;
                    const pointsToMove = selectedPointIndices.length > 0 ? selectedPointIndices : [draggedIdx];

                    pointsToMove.forEach(idx => {
                        let newPoint = selectedPath.segments[idx].point.add(event.delta);

                        // Angle snapping with shift for endpoints (only if single point selected)
                        if (event.modifiers.shift && pointsToMove.length === 1) {
                            const segments = selectedPath.segments;
                            const numSegments = segments.length;

                            // Check if point has only 1 neighbor (is an endpoint)
                            const isEndpoint = (idx === 0 || idx === numSegments - 1) && !selectedPath.closed;

                            if (isEndpoint) {
                                // Get the neighbor point
                                const neighborIndex = idx === 0 ? 1 : numSegments - 2;
                                const neighborPoint = segments[neighborIndex].point;

                                // Calculate angle from neighbor to ACTUAL MOUSE POSITION
                                const dx = event.point.x - neighborPoint.x;
                                const dy = event.point.y - neighborPoint.y;
                                let angle = Math.atan2(dy, dx) * 180 / Math.PI;

                                // Normalize to 0-360
                                if (angle < 0) angle += 360;

                                // Snap to nearest angle (30, 45, 60, 90, etc.)
                                const snapAngle = snapToNearestAngle(angle);
                                const snapAngleRad = snapAngle * Math.PI / 180;

                                // Calculate distance
                                const distance = Math.sqrt(dx * dx + dy * dy);

                                // Set new point at snapped angle
                                newPoint = new paper.Point(
                                    neighborPoint.x + distance * Math.cos(snapAngleRad),
                                    neighborPoint.y + distance * Math.sin(snapAngleRad)
                                );
                            }
                        }

                        selectedPath.segments[idx].point = newPoint;
                        if (handleCircles[idx]) {
                            handleCircles[idx].position = newPoint;
                        }
                    });

                    // Re-render line ends if this is a line
                    if (selectedPath.polygonData.isLine) {
                        renderLineEnds(selectedPath);
                    }

                    status.textContent = `Moving ${pointsToMove.length} point(s)...`;
                } else if (draggingEdgeIndex >= 0 && !createdPointThisDrag && !selectedPath.polygonData.isLine) {
                    // We're dragging a polygon edge - add a point at the current drag location
                    // (Lines don't get new points when dragging edges, they just translate)
                    const newSegment = new paper.Segment(event.point);
                    selectedPath.insert(draggingEdgeIndex + 1, newSegment);

                    // Create handle for new point
                    const handleRect = new paper.Path.Rectangle({
                        center: event.point,
                        size: [5, 5],
                        fillColor: 'white',
                        strokeColor: '#0064c8',
                        strokeWidth: 1,
                        evented: false,
                        selectable: false
                    });
                    handleRect.isHandle = true;
                    handleCircles.splice(draggingEdgeIndex + 1, 0, handleRect);

                    // Switch to dragging the newly created point
                    selectedPoint = newSegment;
                    selectedPointIndices = [draggingEdgeIndex + 1]; // Select the new point
                    isDraggingPoint = true;
                    draggingEdgeIndex = -1;
                    createdPointThisDrag = true;
                    showHandles(selectedPath);
                    status.textContent = 'Created point - dragging...';
                } else if (isDraggingPoint && selectedPoint) {
                    let finalPoint = event.point;

                    // Angle snapping with shift for endpoints (points with only 1 neighbor)
                    if (event.modifiers.shift) {
                        const pointIndex = selectedPoint.index;
                        const segments = selectedPath.segments;
                        const numSegments = segments.length;

                        // Check if point has only 1 neighbor (is an endpoint)
                        const isEndpoint = (pointIndex === 0 || pointIndex === numSegments - 1) && !selectedPath.closed;

                        if (isEndpoint) {
                            // Get the neighbor point
                            const neighborIndex = pointIndex === 0 ? 1 : numSegments - 2;
                            const neighborPoint = segments[neighborIndex].point;

                            // Calculate angle from neighbor to current position
                            const dx = event.point.x - neighborPoint.x;
                            const dy = event.point.y - neighborPoint.y;
                            let angle = Math.atan2(dy, dx) * 180 / Math.PI;

                            // Normalize to 0-360
                            if (angle < 0) angle += 360;

                            // Snap to nearest angle (30, 45, 60, 90, etc.)
                            const snapAngle = snapToNearestAngle(angle);
                            const snapAngleRad = snapAngle * Math.PI / 180;

                            // Calculate distance
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            // Set final point at snapped angle
                            finalPoint = new paper.Point(
                                neighborPoint.x + distance * Math.cos(snapAngleRad),
                                neighborPoint.y + distance * Math.sin(snapAngleRad)
                            );
                        }
                    }

                    // Continue moving the point
                    selectedPoint.point = finalPoint;

                    // Update corresponding handle circle
                    const idx = selectedPoint.index;
                    if (handleCircles[idx]) {
                        handleCircles[idx].position = finalPoint;
                    }

                    status.textContent = 'Moving point...';
                } else if (!createdPointThisDrag) {
                    // Check if this is a meaningful drag to select all points
                    if (selectedPointIndices.length === 0 && (Math.abs(event.delta.x) > 3 || Math.abs(event.delta.y) > 3)) {
                        // Significant drag detected - select all points
                        selectedPointIndices = selectedPath.segments.map((_, idx) => idx);
                        showHandles(selectedPath);
                    }

                    // Move entire polygon
                    selectedPath.translate(event.delta);

                    // Move all handle circles with polygon
                    handleCircles.forEach(circle => circle.translate(event.delta));

                    // Move line end markers with polygon
                    if (selectedPath.lineEndGroup) {
                        selectedPath.lineEndGroup.translate(event.delta);
                    }

                    status.textContent = selectedPointIndices.length > 0 ? `Moving ${selectedPointIndices.length} point(s)...` : 'Drag to select all points';
                }
            }
        };

        // Create rectangular handles for selected polygon vertices
        function showHandles(polygon) {
            hideHandles();

            polygon.segments.forEach((segment, idx) => {
                const isSelected = selectedPointIndices.includes(idx);
                const rect = new paper.Path.Rectangle({
                    center: segment.point,
                    size: isSelected ? [8, 8] : [5, 5],
                    fillColor: isSelected ? '#0064c8' : 'white',
                    strokeColor: '#0064c8',
                    strokeWidth: 1,
                    evented: false,
                    selectable: false
                });
                rect.isHandle = true;
                rect.pointIndex = idx;
                rect.sendToBack();
                handleCircles.push(rect);
            });

            // Keep image at the very back
            if (backgroundRaster) {
                backgroundRaster.sendToBack();
            }

            paper.view.update();
        }

        function hideHandles() {
            handleCircles.forEach(circle => circle.remove());
            handleCircles = [];
            paper.view.update();
        }

        // Keyboard handler
        document.addEventListener('keydown', function(e) {
            const minPoints = isDrawingLine ? 2 : 3;
            if (e.key === 'Escape' && isDrawing && points.length >= minPoints) {
                finishPolygon();
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedPath) {
                    if (selectedPointIndices.length > 0) {
                        // Check how many points would remain
                        const remainingPoints = selectedPath.segments.length - selectedPointIndices.length;
                        const minPoints = selectedPath.polygonData.isLine ? 2 : 3;

                        if (remainingPoints >= minPoints) {
                            // Delete selected points, polygon/line remains
                            const indices = [...selectedPointIndices].sort((a, b) => b - a);
                            indices.forEach(idx => {
                                selectedPath.removeSegment(idx);
                            });

                            selectedPointIndices = [];
                            showHandles(selectedPath);
                            paper.view.update();
                            status.textContent = 'Point(s) deleted. Drag to select all points';
                        } else {
                            // Would leave fewer than minimum points - delete entire object
                            hideHandles();

                            // Remove line end markers if they exist
                            if (selectedPath.lineEndGroup) {
                                selectedPath.lineEndGroup.remove();
                            }

                            selectedPath.remove();
                            polygons = polygons.filter(p => p !== selectedPath);
                            const wasLine = selectedPath?.polygonData?.isLine;
                            selectedPath = null;
                            selectedPoint = null;
                            selectedPointIndices = [];
                            paper.view.update();
                            status.textContent = wasLine ? 'Line deleted' : 'Polygon deleted';
                        }
                    } else {
                        // No points selected - nothing to delete
                        status.textContent = 'Select points to delete or drag to select all';
                    }
                }
            }
        });

        function finishPolygon() {
            const minPoints = isDrawingLine ? 2 : 3;
            if (points.length < minPoints) {
                status.textContent = isDrawingLine ? 'Need at least 2 points!' : 'Need at least 3 points!';
                return;
            }

            // Remove only preview elements (circles, lines, outline), not finished polygons
            const children = paper.project.activeLayer.children;
            for (let i = children.length - 1; i >= 0; i--) {
                const child = children[i];
                // Remove preview items (handles, outlines, lines, faces)
                if (child.isDrawHandle || child.isPreviewOutline || child.isPreviewLine || child.isPreviewFace) {
                    child.remove();
                }
                // Also remove lines that are not part of a finished polygon
                else if (!child.polygonData && child instanceof paper.Path && child.segments.length === 2) {
                    child.remove();
                }
            }

            // Create the actual polygon or line
            const polygon = new paper.Path(points);
            polygon.closed = !isDrawingLine; // Lines are open paths

            // Get style from most recently selected polygon, or fall back to last drawn polygon
            let styleSource = selectedPath;
            if (!styleSource && polygons.length > 0) {
                styleSource = polygons[polygons.length - 1];
            }

            if (isDrawingLine) {
                polygon.fillColor = null;
                polygon.strokeColor = 'black';
                polygon.strokeWidth = 2;
                polygon.polygonData = {
                    points: points.length,
                    isLine: true,
                    lineStart: 'none',
                    lineEnd: 'arrow'
                };
            } else {
                if (styleSource && styleSource.fillColor) {
                    polygon.fillColor = styleSource.fillColor.clone();
                } else {
                    // Use the last remembered color and opacity
                    const hex = lastColor;
                    const r = parseInt(hex.substr(1, 2), 16) / 255;
                    const g = parseInt(hex.substr(3, 2), 16) / 255;
                    const b = parseInt(hex.substr(5, 2), 16) / 255;
                    polygon.fillColor = new paper.Color(r, g, b, lastOpacity);
                }
                polygon.strokeColor = null;
                polygon.polygonData = { points: points.length };
            }

            polygons.push(polygon);

            // Render line ends if this is a line
            if (isDrawingLine) {
                renderLineEnds(polygon);
            }

            points = [];

            // Exit draw mode and enter edit mode
            isDrawing = false;
            isDrawingLine = false;
            drawBtn.classList.remove('active');
            drawLineBtn.classList.remove('active');
            isEditing = true;
            editBtn.classList.add('active');

            status.textContent = `${isDrawingLine ? 'Line' : 'Polygon'} created. Click to edit.`;
            paper.view.update();
        }

        paper.view.update();
    </script>
</body>
</html>
